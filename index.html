
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout con tarjetas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="conteiner">

        <header class="header">
            <h3>HEADER · Logo · Navegación · Menú</h3>
        </header>

        <section class="hero">
            <h2>HERO SECTION</h2>
            <p>Título principal y descripción</p>
            <button>BOTÓN CTA</button>
        </section>

        <div class="cards">

            <div class="card">CARD 1</div>

            <div class="card">CARD 2</div>

            <div class="card">CARD 3</div>

        </div>

        <section class="about">
            <h3>ABOUT / INFORMACIÓN</h3>
        </section>

        <section class="call">
            <h3>CALL TO ACTION</h3>
        </section>

        <footer class="footer">
            <h3>FOOTER</h3>
        </footer>

    </div>

</body>
</html>
